<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>铠甲勇士激斗传</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#000}
#game{width:100%;height:100%;display:flex;justify-content:center;align-items:center}
ruffle-player{width:100%!important;height:100%!important}

/* 控制层 */
#controls{position:fixed;inset:0;z-index:9999;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(2vw,10px) max(2vh,10px);pointer-events:none}

/* 图片式圆形方向摇杆 */
#joystick{
  position:relative;z-index:10;
  width:clamp(190px,29vw,300px);height:clamp(190px,29vw,300px);
  flex-shrink:0;margin-bottom:2vh;
  border-radius:50%;overflow:hidden;
  background:transparent url("wind-eagle-controller.png") center/contain no-repeat;
  pointer-events:auto;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
#joystick::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,transparent 35%,rgba(80,180,255,.10) 62%,transparent 72%);
  pointer-events:none;
}
#joystick.active{filter:brightness(1.18) drop-shadow(0 0 10px #42aaff)}
#stick-dot{
  position:absolute;left:50%;top:50%;width:23%;height:23%;
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid #d9f4ff;background:radial-gradient(circle,#ffffffaa,#278bd966 65%,#082c6699);
  box-shadow:0 0 12px #62caff;opacity:.0;pointer-events:none;
}
#joystick.active #stick-dot{opacity:.9}

/* 右侧技能键 */
.skills{
  position:relative;z-index:10;pointer-events:auto;
  display:grid;grid-template-columns:repeat(3,clamp(54px,9vw,82px));
  grid-template-rows:repeat(2,clamp(54px,9vw,82px));
  gap:clamp(8px,2vw,18px);margin-bottom:5vh
}
.skill{
  display:flex;justify-content:center;align-items:center;border-radius:50%;
  border:3px solid #ffffff88;color:white;font-size:clamp(25px,5vw,40px);
  font-weight:900;background:linear-gradient(145deg,#173c70cc,#061329ee);
  box-shadow:0 2px 10px #0008,inset 0 0 10px #4a8bce55;
  user-select:none;-webkit-user-select:none;pointer-events:auto;touch-action:none
}
.skill.pressed{background:#187edb;box-shadow:0 0 16px #168cff,inset 0 0 10px #a9e5ff}
@media(orientation:portrait){
  #controls{padding:0 8px 18px}
  #joystick{width:155px;height:155px;margin-bottom:1vh}
  .skills{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px);gap:5px;margin-bottom:2vh}
  .skill{font-size:23px;border-width:2px}
}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>
</head>
<body>
<div id="stage"><div id="game"></div></div>

<div id="controls">
  <div id="joystick" aria-label="方向摇杆">
    <div id="stick-dot"></div>
  </div>
  <div class="skills">
    <div class="skill" data-key="KeyJ">J</div>
    <div class="skill" data-key="KeyK">K</div>
    <div class="skill" data-key="KeyL">L</div>
    <div class="skill" data-key="KeyU">U</div>
    <div class="skill" data-key="KeyI">I</div>
    <div class="skill" data-key="KeyO">O</div>
  </div>
</div>

<script>
(function(){
  const container=document.getElementById("game");
  window.RufflePlayer=window.RufflePlayer||{};
  window.RufflePlayer.config={
    autoplay:"on",unmuteOverlay:"hidden",letterbox:"on",
    backgroundColor:"#000000",scale:"showAll",forceScale:true,
    allowScriptAccess:false,logLevel:"error",wmode:"direct",quality:"high"
  };

  function startGame(){
    if(!window.RufflePlayer||!window.RufflePlayer.newest){
      console.error("Ruffle加载失败");return;
    }
    const player=window.RufflePlayer.newest().createPlayer();
    player.id="ruffle-player";
    player.style.width="100%";player.style.height="100%";player.tabIndex=0;
    container.appendChild(player);
    window.flashPlayer=player;
    player.load({url:"game.swf",autoplay:"on"});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",startGame);
  else startGame();

  const keyInfo={
    KeyW:{key:"w",code:"KeyW",num:87},KeyS:{key:"s",code:"KeyS",num:83},
    KeyA:{key:"a",code:"KeyA",num:65},KeyD:{key:"d",code:"KeyD",num:68},
    KeyJ:{key:"j",code:"KeyJ",num:74},KeyK:{key:"k",code:"KeyK",num:75},
    KeyL:{key:"l",code:"KeyL",num:76},KeyU:{key:"u",code:"KeyU",num:85},
    KeyI:{key:"i",code:"KeyI",num:73},KeyO:{key:"o",code:"KeyO",num:79}
  };
  const held=new Map();
  const pointers=new Map();

  function sendKey(code,down){
    const player=window.flashPlayer||document.getElementById("ruffle-player");
    const info=keyInfo[code];
    if(!player||!info)return;
    player.focus();
    const event=new KeyboardEvent(down?"keydown":"keyup",{
      key:info.key,code:info.code,keyCode:info.num,which:info.num,
      bubbles:true,cancelable:true,composed:true
    });
    player.dispatchEvent(event);
  }
  function hold(code,token){
    if(pointers.has(token))return;
    pointers.set(token,code);
    const count=held.get(code)||0;
    held.set(code,count+1);
    if(count===0)sendKey(code,true);
    const button=document.querySelector('[data-key="'+code+'"]');
    if(button)button.classList.add("pressed");
  }
  function release(token){
    if(!pointers.has(token))return;
    const code=pointers.get(token);pointers.delete(token);
    const count=(held.get(code)||1)-1;
    if(count<=0){
      held.delete(code);sendKey(code,false);
      const button=document.querySelector('[data-key="'+code+'"]');
      if(button)button.classList.remove("pressed");
    }else held.set(code,count);
  }
  function setJoystickKeys(nextCodes,token){
    const previous=joystickCodes;
    previous.forEach(code=>{if(!nextCodes.has(code))release(token+":"+code)});
    nextCodes.forEach(code=>{if(!previous.has(code))hold(code,token+":"+code)});
    joystickCodes=nextCodes;
  }

  /* 图片摇杆：按住并向圆盘边缘拖动，支持八方向 */
  const joystick=document.getElementById("joystick");
  const dot=document.getElementById("stick-dot");
  let joystickPointer=null,joystickCodes=new Set();
  function updateJoystick(e){
    const rect=joystick.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    let dx=(e.clientX-cx)/(rect.width/2);
    let dy=(e.clientY-cy)/(rect.height/2);
    const distance=Math.hypot(dx,dy);
    if(distance>1){dx/=distance;dy/=distance}
    dot.style.left=(50+dx*27)+"%";
    dot.style.top=(50+dy*27)+"%";

    const deadZone=.22,threshold=.38,next=new Set();
    if(Math.hypot(dx,dy)>=deadZone){
      if(dy < -threshold)next.add("KeyW");
      if(dy > threshold)next.add("KeyS");
      if(dx < -threshold)next.add("KeyA");
      if(dx > threshold)next.add("KeyD");
    }
    setJoystickKeys(next,"joy");
  }
  function endJoystick(){
    if(joystickPointer===null)return;
    setJoystickKeys(new Set(),"joy");
    joystickPointer=null;joystick.classList.remove("active");
    dot.style.left="50%";dot.style.top="50%";
  }
  joystick.addEventListener("pointerdown",e=>{
    e.preventDefault();joystickPointer=e.pointerId;
    try{joystick.setPointerCapture(e.pointerId)}catch(err){}
    joystick.classList.add("active");updateJoystick(e);
  });
  joystick.addEventListener("pointermove",e=>{
    if(e.pointerId!==joystickPointer)return;
    e.preventDefault();updateJoystick(e);
  });
  joystick.addEventListener("pointerup",e=>{if(e.pointerId===joystickPointer)endJoystick()});
  joystick.addEventListener("pointercancel",endJoystick);
  joystick.addEventListener("lostpointercapture",endJoystick);

  /* 右侧技能键，支持多点触控 */
  document.querySelectorAll(".skill[data-key]").forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{
      e.preventDefault();e.stopPropagation();
      try{btn.setPointerCapture(e.pointerId)}catch(err){}
      hold(btn.dataset.key,"skill:"+e.pointerId);
    });
    btn.addEventListener("pointerup",e=>{e.preventDefault();release("skill:"+e.pointerId)});
    btn.addEventListener("pointercancel",e=>release("skill:"+e.pointerId));
    btn.addEventListener("lostpointercapture",e=>release("skill:"+e.pointerId));
    btn.addEventListener("contextmenu",e=>e.preventDefault());
  });

  function releaseAll(){
    Array.from(pointers.keys()).forEach(release);
    held.clear();pointers.clear();joystickCodes.clear();
    joystickPointer=null;joystick.classList.remove("active");
    dot.style.left="50%";dot.style.top="50%";
    document.querySelectorAll(".pressed").forEach(el=>el.classList.remove("pressed"));
  }
  window.addEventListener("blur",releaseAll);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)releaseAll()});
  document.addEventListener("contextmenu",e=>e.preventDefault());
})();
</script>
</body>
</html>
