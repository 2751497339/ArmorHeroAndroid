
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>铠甲勇士激斗传</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: system-ui, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

#game {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

/* 左侧方向控制区 */
#controls {
  position: fixed;
  left: max(12px, env(safe-area-inset-left));
  bottom: max(18px, env(safe-area-inset-bottom));
  pointer-events: none;
  z-index: 100;
}

/* 十字方向键布局 */
.group {
  display: grid;
  grid-template-columns: repeat(3, clamp(58px, 10vw, 78px));
  grid-template-rows: repeat(3, clamp(58px, 10vw, 78px));
  gap: 5px;
  pointer-events: auto;
}

/* 铠甲勇士风格按键 */
.key {
  width: clamp(58px, 10vw, 78px);
  height: clamp(58px, 10vw, 78px);

  display: flex;
  align-items: center;
  justify-content: center;

  border: 3px solid #f1c65b;
  border-radius: 16px;

  background: linear-gradient(
    145deg,
    #c9362b,
    #741313
  );

  color: #fff3c5;
  font-size: clamp(25px, 5vw, 34px);
  font-weight: 900;

  user-select: none;
  -webkit-user-select: none;

  box-shadow:
    0 0 10px #e8bd5488,
    inset 0 0 12px #ffcf5555,
    0 4px 8px #000a;

  transition: transform 0.05s, background 0.05s;
}

/* 按下效果 */
.key:active,
.key.pressed {
  background: linear-gradient(
    145deg,
    #ffcf4b,
    #a72a19
  );

  color: #ffffff;
  transform: scale(0.91);

  box-shadow:
    0 0 18px #ffcf4b,
    inset 0 0 12px #fff5aa;
}

/* 方向键中心装饰 */
.center {
  display: flex;
  align-items: center;
  justify-content: center;

  border: 2px solid #d5a83e;
  border-radius: 50%;

  background: radial-gradient(
    circle,
    #4c2020,
    #160909
  );

  color: #f6ce65;
  font-size: 25px;
  font-weight: bold;
  box-shadow: 0 0 10px #d8a83e88;
}

/* 游戏提示 */
#hint {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);

  color: white;
  background: #0009;

  padding: 7px 14px;
  border-radius: 20px;

  font-size: 12px;
  pointer-events: none;
  z-index: 101;
}

/* 退出提示 */
#exit {
  display: none;
  position: fixed;
  inset: 0;

  background: #000d;
  color: white;

  align-items: center;
  justify-content: center;
  text-align: center;

  font-size: 18px;
  z-index: 200;
}
</style>

<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>

</head>

<body>

<!-- 游戏画面 -->
<div id="stage">
  <div id="game"></div>
</div>

<!-- 顶部提示 -->
<div id="hint">
  铠甲勇士 · 上下左右移动
</div>

<!-- 左侧四方向控制 -->
<div id="controls">

  <div class="group">

    <!-- 第一排 -->
    <div></div>

    <div class="key" data-key="ArrowUp">
      ▲
    </div>

    <div></div>

    <!-- 第二排 -->
    <div class="key" data-key="ArrowLeft">
      ◀
    </div>

    <div class="center">
      ✦
    </div>

    <div class="key" data-key="ArrowRight">
      ▶
    </div>

    <!-- 第三排 -->
    <div></div>

    <div class="key" data-key="ArrowDown">
      ▼
    </div>

    <div></div>

  </div>
</div>

<!-- 退出提示 -->
<div id="exit">
  返回游戏
  <br>
  <small>再次按系统返回键退出</small>
</div>

<script>
(function() {

  const container = document.getElementById('game');

  window.RufflePlayer = window.RufflePlayer || {};

  window.RufflePlayer.config = {
    autoplay: 'on',
    unmuteOverlay: 'hidden',
    letterbox: 'on',
    backgroundColor: '#000000',
    scale: 'showAll',
    forceScale: true,
    allowScriptAccess: false,
    logLevel: 'error',
    wmode: 'direct',
    quality: 'high'
  };

  let player = null;

  // 启动 Flash 游戏
  function start() {

    if (!window.RufflePlayer ||
        !window.RufflePlayer.newest) {
      return;
    }

    const r = window.RufflePlayer.newest();

    player = r.createPlayer();

    player.id = 'ruffle-player';

    player.style.width = '100%';
    player.style.height = '100%';

    container.appendChild(player);

    player.load({
      url: 'game.swf',
      autoplay: 'on'
    });

    window.flashPlayer = player;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  // 方向键对应的键值
  const keyCodes = {
    ArrowUp: 38,
    ArrowDown: 40,
    ArrowLeft: 37,
    ArrowRight: 39
  };

  // 记录当前按下的按键
  const activeKeys = new Map();

  // 向 Flash 游戏发送键盘事件
  function send(key, down) {

    const target = player;

    if (!target) return;

    if (target.focus) {
      target.focus();
    }

    const code = keyCodes[key];

    if (!code) return;

    const event = new KeyboardEvent(
      down ? 'keydown' : 'keyup',
      {
        key: key,
        code: key,
        keyCode: code,
        which: code,
        bubbles: true,
        cancelable: true,
        composed: true
      }
    );

    target.dispatchEvent(event);
  }

  // 按下方向键
  function press(key, element, pointerId) {

    const id = pointerId + ':' + key;

    if (activeKeys.has(id)) return;

    activeKeys.set(id, {
      key: key,
      element: element
    });

    element.classList.add('pressed');

    send(key, true);
  }

  // 松开方向键
  function release(id) {

    const item = activeKeys.get(id);

    if (!item) return;

    send(item.key, false);

    item.element.classList.remove('pressed');

    activeKeys.delete(id);
  }

  // 松开所有按键
  function releaseAll() {

    for (const id of Array.from(activeKeys.keys())) {
      release(id);
    }
  }

  // 绑定四个方向键
  document.querySelectorAll('.key[data-key]').forEach(function(button) {

    const key = button.dataset.key;

    button.addEventListener('pointerdown', function(e) {

      e.preventDefault();

      try {
        button.setPointerCapture(e.pointerId);
      } catch(err) {}

      press(key, button, e.pointerId);

    });

    button.addEventListener('pointerup', function(e) {

      e.preventDefault();

      release(e.pointerId + ':' + key);

    });

    button.addEventListener('pointercancel', function(e) {

      release(e.pointerId + ':' + key);

    });

    button.addEventListener('lostpointercapture', function(e) {

      release(e.pointerId + ':' + key);

    });

    button.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

  });

  // 切换页面或失去焦点时，自动松开按键
  window.addEventListener('blur', releaseAll);

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      releaseAll();
    }
  });

  // 阻止手机双击缩放
  document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
  });

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

})();
</script>

</body>
</html>
