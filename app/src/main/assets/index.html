
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>铠甲勇士激斗传</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#000;
  font-family:system-ui,sans-serif;
}
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;
  justify-content:center;background:#000;
}
#game{
  width:100%;height:100%;
  display:block;object-fit:contain;
}
#controls{
  position:fixed;inset:0;
  pointer-events:none;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 max(3vw,12px) max(4vh,16px);
}
.pad{
  width:clamp(140px,23vw,190px);
  height:clamp(110px,20vw,160px);
  border:2px solid #ffffff66;
  border-radius:50%;
  background:#18253666;
  display:flex;
  align-items:center;
  justify-content:space-evenly;
  pointer-events:auto;
}
.key{
  width:clamp(54px,9vw,78px);
  height:clamp(54px,9vw,78px);
  border:2px solid #ffffff99;
  border-radius:50%;
  background:#182536bb;
  color:white;
  font-size:clamp(21px,4vw,30px);
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  -webkit-user-select:none;
  box-shadow:0 2px 10px #0008;
}
.key:active{
  background:#ffffff66;
}
.right{
  display:grid;
  grid-template-columns:repeat(3,clamp(54px,9vw,78px));
  grid-template-rows:repeat(2,clamp(54px,9vw,78px));
  gap:clamp(8px,2vw,16px);
  pointer-events:auto;
}
.right .key{
  background:#173e70bb;
}
#hint{
  position:fixed;
  left:50%;top:10px;
  transform:translateX(-50%);
  color:white;background:#0009;
  padding:6px 12px;
  border-radius:16px;
  font-size:12px;
  pointer-events:none;
}
#exit{
  display:none;position:fixed;inset:0;
  background:#000b;color:white;
  align-items:center;justify-content:center;
  text-align:center;font-size:16px;
  pointer-events:auto;
}
@media (orientation:portrait){
  #controls{
    padding:0 10px 25px;
  }
  .pad{
    width:125px;height:100px;
  }
  .key{
    width:48px;height:48px;font-size:19px;
  }
  .right{
    grid-template-columns:repeat(3,48px);
    grid-template-rows:repeat(2,48px);
    gap:6px;
  }
}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>
</head>
<body>

<div id="stage">
  <div id="game"></div>
</div>

<div id="hint">横屏游戏 · 左右移动 / J K L U I O 技能按键</div>

<div id="controls">

  <!-- 左侧移动 -->
  <div class="pad">
    <div class="key" data-key="ArrowLeft">◀</div>
    <div class="key" data-key="ArrowRight">▶</div>
  </div>

  <!-- 右侧六个按键 -->
  <div class="right">
    <div class="key" data-key="KeyJ">J</div>
    <div class="key" data-key="KeyK">K</div>
    <div class="key" data-key="KeyL">L</div>
    <div class="key" data-key="KeyU">U</div>
    <div class="key" data-key="KeyI">I</div>
    <div class="key" data-key="KeyO">O</div>
  </div>

</div>

<div id="exit" onclick="this.style.display='none'">
  返回游戏<br>
  <small>再次按系统返回键退出</small>
</div>

<script>
(function(){

 const container=document.getElementById('game');

 window.RufflePlayer=window.RufflePlayer||{};

 window.RufflePlayer.config={
   autoplay:'on',
   unmuteOverlay:'hidden',
   letterbox:'on',
   backgroundColor:'#000000',
   scale:'showAll',
   forceScale:true,
   allowScriptAccess:false,
   logLevel:'error',
   wmode:'direct',
   quality:'high'
 };

 function start(){
   if(!window.RufflePlayer ||
      !window.RufflePlayer.newest)return;

   const r=window.RufflePlayer.newest();
   const player=r.createPlayer();

   player.id='ruffle-player';
   player.style.width='100%';
   player.style.height='100%';

   container.appendChild(player);

   player.load({
     url:'game.swf',
     autoplay:'on'
   });

   window.flashPlayer=player;
 }

 if(document.readyState==='loading'){
   document.addEventListener('DOMContentLoaded',start);
 }else{
   start();
 }

 // 按键对应关系
 const keyInfo={
   ArrowLeft:{key:'ArrowLeft',code:'ArrowLeft',num:37},
   ArrowRight:{key:'ArrowRight',code:'ArrowRight',num:39},
   KeyJ:{key:'j',code:'KeyJ',num:74},
   KeyK:{key:'k',code:'KeyK',num:75},
   KeyL:{key:'l',code:'KeyL',num:76},
   KeyU:{key:'u',code:'KeyU',num:85},
   KeyI:{key:'i',code:'KeyI',num:73},
   KeyO:{key:'o',code:'KeyO',num:79}
 };

 const held=new Map();
 const pointers=new Map();

 // 发送键盘事件
 function send(code,down){
   const target=document.getElementById('ruffle-player');
   if(!target)return;

   if(target.focus)target.focus();

   const info=keyInfo[code];
   if(!info)return;

   const event=new KeyboardEvent(
     down?'keydown':'keyup',
     {
       key:info.key,
       code:info.code,
       keyCode:info.num,
       which:info.num,
       bubbles:true,
       cancelable:true,
       composed:true
     }
   );

   target.dispatchEvent(event);
 }

 // 按下和松开，支持多指同时操作
 document.querySelectorAll('[data-key]').forEach(btn=>{

   const code=btn.dataset.key;

   btn.addEventListener('pointerdown',e=>{
     e.preventDefault();

     if(pointers.has(e.pointerId))return;

     try{
       btn.setPointerCapture(e.pointerId);
     }catch(err){}

     pointers.set(e.pointerId,code);

     const count=held.get(code)||0;
     held.set(code,count+1);

     if(count===0){
       send(code,true);
     }
   });

   function release(e){
     if(!pointers.has(e.pointerId))return;

     const pressed=pointers.get(e.pointerId);
     pointers.delete(e.pointerId);

     const count=(held.get(pressed)||1)-1;

     if(count<=0){
       held.delete(pressed);
       send(pressed,false);
     }else{
       held.set(pressed,count);
     }
   }

   btn.addEventListener('pointerup',release);
   btn.addEventListener('pointercancel',release);
   btn.addEventListener('lostpointercapture',release);

 });

 // 页面失去焦点时释放所有按键
 function releaseAll(){
   held.forEach((count,code)=>{
     send(code,false);
   });
   held.clear();
   pointers.clear();
 }

 window.addEventListener('blur',releaseAll);

 document.addEventListener('contextmenu',e=>{
   e.preventDefault();
 });

})();
</script>

</body>
</html>
