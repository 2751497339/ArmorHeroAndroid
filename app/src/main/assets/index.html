
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>铠甲勇士激斗传</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,sans-serif;
}
#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}
#game{
  width:100%;
  height:100%;
  display:block;
}
ruffle-player{
  width:100%!important;
  height:100%!important;
}

/* 控制区域 */
#controls{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 max(3vw,12px) max(4vh,16px);
}

/* 炎龙铠甲召唤器 */
.pad{
  width:clamp(160px,25vw,220px);
  height:clamp(160px,25vw,220px);
  padding:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:5px;
  align-items:center;
  justify-items:center;
  border:5px solid #d8b66b;
  border-radius:50%;
  background:
    radial-gradient(circle,#294b70 0%,#122b4b 55%,#080e1b 100%);
  box-shadow:
    0 0 10px #168cff,
    0 0 22px #0066bb99,
    inset 0 0 18px #ffffff55;
  pointer-events:auto;
}

/* 四方向键 */
.direction{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid #f4d58a;
  border-radius:13px;
  color:white;
  font-size:clamp(23px,5vw,37px);
  font-weight:900;
  background:
    linear-gradient(145deg,#ed5130,#a71912 65%,#5b0808);
  box-shadow:
    0 0 8px #ff5722,
    inset 0 0 10px #ffc36a88;
  user-select:none;
  -webkit-user-select:none;
}

.direction:active,
.direction.pressed{
  background:linear-gradient(145deg,#ffb23c,#ed3018);
  box-shadow:0 0 20px #ff541d;
  transform:scale(.91);
}

.up{
  grid-column:2;
  grid-row:1;
}
.left{
  grid-column:1;
  grid-row:2;
}
.right-arrow{
  grid-column:3;
  grid-row:2;
}
.down{
  grid-column:2;
  grid-row:3;
}

/* 召唤器中心 */
.core{
  grid-column:2;
  grid-row:2;
  width:100%;
  height:100%;
  border-radius:50%;
  border:3px solid #f5d47c;
  background:
    radial-gradient(circle,#fff4a3 0%,#ffb52e 28%,#df4018 65%,#7d100b 100%);
  box-shadow:
    0 0 12px #ff9d00,
    inset 0 0 10px #fff5b0;
}

/* 右侧六个技能键 */
.skills{
  display:grid;
  grid-template-columns:repeat(3,clamp(54px,9vw,78px));
  grid-template-rows:repeat(2,clamp(54px,9vw,78px));
  gap:clamp(8px,2vw,16px);
  pointer-events:auto;
}

.key{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  border:2px solid #ffffff99;
  border-radius:50%;
  background:#173e70bb;
  color:white;
  font-size:clamp(21px,4vw,30px);
  font-weight:bold;
  user-select:none;
  -webkit-user-select:none;
  box-shadow:0 2px 10px #0008;
}

.key:active,
.key.pressed{
  background:#168cff;
  box-shadow:0 0 18px #00aaff;
  transform:scale(.93);
}

/* 竖屏适配 */
@media (orientation:portrait){
  #controls{
    padding:0 10px 25px;
  }
  .pad{
    width:135px;
    height:135px;
    padding:8px;
    gap:3px;
  }
  .direction{
    font-size:22px;
  }
  .skills{
    grid-template-columns:repeat(3,48px);
    grid-template-rows:repeat(2,48px);
    gap:6px;
  }
}
</style>

<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>
</head>

<body>

<div id="stage">
  <div id="game"></div>
</div>

<div id="controls">

  <!-- 左侧炎龙铠甲召唤器方向键 -->
  <div class="pad">

    <div class="direction up" data-key="ArrowUp">▲</div>

    <div class="direction left" data-key="ArrowLeft">◀</div>

    <div class="core"></div>

    <div class="direction right-arrow" data-key="ArrowRight">▶</div>

    <div class="direction down" data-key="ArrowDown">▼</div>

  </div>

  <!-- 右侧技能键保持不变 -->
  <div class="skills">

    <div class="key" data-key="KeyJ">J</div>
    <div class="key" data-key="KeyK">K</div>
    <div class="key" data-key="KeyL">L</div>

    <div class="key" data-key="KeyU">U</div>
    <div class="key" data-key="KeyI">I</div>
    <div class="key" data-key="KeyO">O</div>

  </div>

</div>

<script>
(function(){

 const container=document.getElementById('game');

 window.RufflePlayer=window.RufflePlayer||{};

 window.RufflePlayer.config={
   autoplay:'on',
   unmuteOverlay:'hidden',
   letterbox:'on',
   backgroundColor:'#000000',
   scale:'showAll',
   forceScale:true,
   allowScriptAccess:false,
   logLevel:'error',
   wmode:'direct',
   quality:'high'
 };

 function start(){
   if(!window.RufflePlayer ||
      !window.RufflePlayer.newest)return;

   const r=window.RufflePlayer.newest();
   const player=r.createPlayer();

   player.id='ruffle-player';
   player.style.width='100%';
   player.style.height='100%';

   container.appendChild(player);

   player.load({
     url:'game.swf',
     autoplay:'on'
   });

   window.flashPlayer=player;
 }

 if(document.readyState==='loading'){
   document.addEventListener('DOMContentLoaded',start);
 }else{
   start();
 }

 // 所有按键映射
 const keyInfo={
   ArrowUp:{key:'ArrowUp',code:'ArrowUp',num:38},
   ArrowDown:{key:'ArrowDown',code:'ArrowDown',num:40},
   ArrowLeft:{key:'ArrowLeft',code:'ArrowLeft',num:37},
   ArrowRight:{key:'ArrowRight',code:'ArrowRight',num:39},

   KeyJ:{key:'j',code:'KeyJ',num:74},
   KeyK:{key:'k',code:'KeyK',num:75},
   KeyL:{key:'l',code:'KeyL',num:76},
   KeyU:{key:'u',code:'KeyU',num:85},
   KeyI:{key:'i',code:'KeyI',num:73},
   KeyO:{key:'o',code:'KeyO',num:79}
 };

 const held=new Map();
 const pointers=new Map();

 // 发送键盘事件
 function send(code,down){

   const target=document.getElementById('ruffle-player');
   if(!target)return;

   const info=keyInfo[code];
   if(!info)return;

   if(target.focus)target.focus();

   const event=new KeyboardEvent(
     down?'keydown':'keyup',
     {
       key:info.key,
       code:info.code,
       keyCode:info.num,
       which:info.num,
       bubbles:true,
       cancelable:true,
       composed:true
     }
   );

   target.dispatchEvent(event);
 }

 // 多指触控
 document.querySelectorAll('[data-key]').forEach(btn=>{

   const code=btn.dataset.key;

   btn.addEventListener('pointerdown',e=>{

     e.preventDefault();

     if(pointers.has(e.pointerId))return;

     try{
       btn.setPointerCapture(e.pointerId);
     }catch(err){}

     pointers.set(e.pointerId,code);

     const count=held.get(code)||0;
     held.set(code,count+1);

     if(count===0){
       btn.classList.add('pressed');
       send(code,true);
     }

   });

   function release(e){

     if(!pointers.has(e.pointerId))return;

     const pressed=pointers.get(e.pointerId);
     pointers.delete(e.pointerId);

     const count=(held.get(pressed)||1)-1;

     if(count<=0){
       held.delete(pressed);
       send(pressed,false);

       document.querySelectorAll('[data-key="'+pressed+'"]').forEach(b=>{
         b.classList.remove('pressed');
       });

     }else{
       held.set(pressed,count);
     }
   }

   btn.addEventListener('pointerup',release);
   btn.addEventListener('pointercancel',release);
   btn.addEventListener('lostpointercapture',release);

 });

 // 失去焦点时释放所有按键
 function releaseAll(){

   held.forEach((count,code)=>{
     send(code,false);
   });

   held.clear();
   pointers.clear();

   document.querySelectorAll('.pressed').forEach(btn=>{
     btn.classList.remove('pressed');
   });
 }

 window.addEventListener('blur',releaseAll);

 document.addEventListener('contextmenu',e=>{
   e.preventDefault();
 });

})();
</script>

</body>
</html>
