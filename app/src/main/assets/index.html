<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>铠甲勇士激斗传</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#game{width:100%;height:100%;display:block;object-fit:contain}
#controls{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(3vw,16px) max(3vh,14px)}
.group{display:flex;align-items:flex-end;gap:clamp(12px,3vw,30px);pointer-events:auto}
.key{width:clamp(58px,10vw,88px);height:clamp(58px,10vw,88px);border:2px solid #ffffff99;border-radius:50%;background:#182536aa;color:white;font-size:clamp(20px,4vw,30px);font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none;box-shadow:0 2px 10px #0008}
.key.action{width:clamp(68px,11vw,98px);height:clamp(68px,11vw,98px);background:#8d2020bb}
.key.jump{background:#174d9bbb}
#hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);color:#fff;background:#0009;padding:6px 12px;border-radius:16px;font-size:12px;pointer-events:none;opacity:.85}
#exit{display:none;position:fixed;inset:0;background:#000b;color:white;align-items:center;justify-content:center;text-align:center;font-size:16px;pointer-events:auto}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="hint">横屏游戏 · 左右移动 / 攻击 / 跳跃</div>
<div id="controls">
 <div class="group">
  <div class="key" data-key="ArrowLeft">◀</div>
  <div class="key" data-key="ArrowRight">▶</div>
 </div>
 <div class="group">
  <div class="key action" data-key="Control">攻击</div>
  <div class="key jump" data-key="Space">跳跃</div>
 </div>
</div>
<div id="exit" onclick="this.style.display='none'">返回游戏<br><small>再次按系统返回键退出</small></div>
<script>
(function(){
 const container=document.getElementById('game');
 window.RufflePlayer=window.RufflePlayer||{};
 window.RufflePlayer.config={
   autoplay:'on',unmuteOverlay:'hidden',letterbox:'on',
   backgroundColor:'#000000',scale:'showAll',forceScale:true,
   allowScriptAccess:false,logLevel:'error',
   wmode:'direct',quality:'high'
 };
 function start(){
   if(!window.RufflePlayer||!window.RufflePlayer.newest)return;
   const r=window.RufflePlayer.newest();
   const player=r.createPlayer();
   player.id='ruffle-player';
   player.style.width='100%'; player.style.height='100%';
   container.appendChild(player);
   player.load({url:'game.swf', autoplay:'on'});
   window.flashPlayer=player;
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
 
function send(key,down){
  const target=document.getElementById('ruffle-player');
  if(!target)return;

  if(target.focus)target.focus();

  const code=key==='ArrowLeft'?37:
    key==='ArrowRight'?39:
    key==='Space'?32:17;

  const event=new KeyboardEvent(
    down?'keydown':'keyup',
    {
      key:key==='Control'?'Control':key,
      code:key,
      keyCode:code,
      which:code,
      bubbles:true,
      cancelable:true,
      composed:true
    }
  );

  target.dispatchEvent(event);
}
