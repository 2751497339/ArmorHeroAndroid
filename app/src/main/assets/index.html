
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>铠甲勇士激斗传</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

#game {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

ruffle-player {
  width: 100% !important;
  height: 100% !important;
}

#controls {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 3vw 5vh;
}

/* =================================
   左侧：炎龙铠甲召唤器
================================= */

.dpad {
  pointer-events: auto;
  position: relative;

  width: clamp(190px, 29vw, 250px);
  height: clamp(190px, 29vw, 250px);

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 5px;

  padding: 13px;

  border: 4px solid #e9a83e;
  border-radius: 32%;

  background:
    radial-gradient(
      circle at center,
      #ffbd45 0%,
      #a82b16 35%,
      #57140d 75%,
      #210805 100%
    );

  box-shadow:
    0 0 8px #ff4b16,
    0 0 20px #ff8b24,
    inset 0 0 15px #ffcf6c,
    inset 0 0 35px #350600;

  margin-bottom: 2vh;
}

/* 外围金色装饰 */

.dpad::before {
  content: "";
  position: absolute;
  inset: 5px;

  border: 2px solid #ffd77b;
  border-radius: 31%;

  pointer-events: none;
  box-shadow:
    inset 0 0 12px #ffb02e,
    0 0 8px #ffcf63;
}

/* 中央炎龙召唤核心 */

.summon-core {
  grid-column: 2;
  grid-row: 2;

  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 3px solid #ffda78;

  background:
    radial-gradient(
      circle,
      #ffdc79 0%,
      #d83b17 42%,
      #681007 100%
    );

  color: #fff0b5;

  font-size: clamp(25px, 5vw, 39px);
  font-weight: 900;

  text-shadow:
    0 0 5px #fff,
    0 0 12px #ff9d25;

  box-shadow:
    0 0 12px #ffac36,
    inset 0 0 12px #ffeb9c;
}

/* 四个方向按钮 */

.direction {
  position: relative;
  z-index: 3;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 3px solid #ffd77a;
  border-radius: 15px;

  background:
    linear-gradient(
      145deg,
      #e95725,
      #9b1d10 60%,
      #4c0b08
    );

  color: #fff0bd;

  font-size: clamp(23px, 5vw, 32px);
  font-weight: 900;

  text-shadow:
    0 0 5px #ffbd50;

  box-shadow:
    0 0 8px #ff7725,
    inset 0 0 9px #ffbd59,
    inset 0 -5px 8px #550900;

  user-select: none;
}

.direction:active,
.direction.pressed {
  background:
    linear-gradient(
      145deg,
      #ffdb71,
      #ef671c,
      #b21d0b
    );

  color: white;

  transform: scale(.90);

  box-shadow:
    0 0 12px #fff0a0,
    0 0 25px #ff5a12,
    inset 0 0 12px #fff2a8;
}

.up {
  grid-column: 2;
  grid-row: 1;
}

.left {
  grid-column: 1;
  grid-row: 2;
}

.right {
  grid-column: 3;
  grid-row: 2;
}

.down {
  grid-column: 2;
  grid-row: 3;
}

/* =================================
   右侧技能键：保留原样
================================= */

.skills {
  pointer-events: auto;
  display: grid;

  grid-template-columns: repeat(3, min(17vw, 82px));
  grid-template-rows: repeat(2, min(17vw, 82px));

  gap: clamp(8px, 2vw, 22px);

  margin-bottom: 5vh;
}

.key {
  display: flex;
  justify-content: center;
  align-items: center;

  border: 2px solid #8bdcff;
  color: white;

  background: linear-gradient(
    145deg,
    #174e83dd,
    #071c39ee
  );

  border-radius: 18px;

  box-shadow:
    0 0 8px #168cff88,
    inset 0 0 12px #3c9fff66;

  font-size: 30px;
  font-weight: bold;
  user-select: none;
  cursor: pointer;
}

.skill {
  border-radius: 50%;
  border: 3px solid #9bdcff;

  background: linear-gradient(
    145deg,
    #155c9cdd,
    #061c42ee
  );

  color: white;

  font-size: clamp(25px, 5vw, 40px);
  font-weight: 900;

  box-shadow:
    0 0 12px #168cff99,
    inset 0 0 14px #4dbdff66;
}

.skill:active,
.skill.pressed {
  background: #00aaff;
  box-shadow: 0 0 20px #00c8ff;
  transform: scale(.93);
}

/* 顶部提示 */

#hint {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);

  color: white;
  background: #061c39cc;

  border: 1px solid #58bfff;
  border-radius: 20px;

  padding: 7px 16px;

  font-size: 13px;
  white-space: nowrap;
  pointer-events: none;
}

@media (orientation: portrait) {
  #hint {
    top: 8px;
  }
}
</style>

<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>

</head>

<body>

<div id="stage">
  <div id="game"></div>
</div>

<div id="hint">
  炎龙铠甲召唤器 · 方向移动 / J K L U I O 技能
</div>

<div id="controls">

  <!-- 左侧炎龙铠甲召唤器 -->

  <div class="dpad">

    <div class="direction up"
         data-key="ArrowUp">▲</div>

    <div class="direction left"
         data-key="ArrowLeft">◀</div>

    <div class="summon-core">炎</div>

    <div class="direction right"
         data-key="ArrowRight">▶</div>

    <div class="direction down"
         data-key="ArrowDown">▼</div>

  </div>

  <!-- 右侧六个技能键：完全保留 -->

  <div class="skills">

    <div class="key skill" data-key="j">J</div>
    <div class="key skill" data-key="k">K</div>
    <div class="key skill" data-key="l">L</div>

    <div class="key skill" data-key="u">U</div>
    <div class="key skill" data-key="i">I</div>
    <div class="key skill" data-key="o">O</div>

  </div>

</div>

<script>
(function() {

  const container = document.getElementById("game");

  window.RufflePlayer = window.RufflePlayer || {};

  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    letterbox: "on",
    backgroundColor: "#000000",
    scale: "showAll",
    forceScale: true,
    allowScriptAccess: false,
    logLevel: "error",
    wmode: "direct",
    quality: "high"
  };

  function startGame() {

    if (!window.RufflePlayer ||
        !window.RufflePlayer.newest) {
      return;
    }

    const ruffle = window.RufflePlayer.newest();

    const player = ruffle.createPlayer();

    player.id = "ruffle-player";

    player.style.width = "100%";
    player.style.height = "100%";

    container.appendChild(player);

    player.load({
      url: "game.swf",
      autoplay: "on"
    });

    window.flashPlayer = player;
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startGame);
  } else {
    startGame();
  }

  // 键盘事件

  function sendKey(key, down) {

    const codeMap = {
      ArrowUp: 38,
      ArrowDown: 40,
      ArrowLeft: 37,
      ArrowRight: 39,
      j: 74,
      k: 75,
      l: 76,
      u: 85,
      i: 73,
      o: 79
    };

    const code = codeMap[key];

    if (!code) return;

    const event = new KeyboardEvent(
      down ? "keydown" : "keyup",
      {
        key: key,
        code: key.startsWith("Arrow")
          ? key
          : "Key" + key.toUpperCase(),
        keyCode: code,
        which: code,
        bubbles: true,
        cancelable: true
      }
    );

    window.dispatchEvent(event);
  }

  // 触摸按键控制

  document.querySelectorAll("[data-key]").forEach(button => {

    const key = button.dataset.key;

    function press(e) {
      e.preventDefault();

      if (button.classList.contains("pressed")) return;

      button.classList.add("pressed");

      sendKey(key, true);
    }

    function release(e) {
      e.preventDefault();

      button.classList.remove("pressed");

      sendKey(key, false);
    }

    button.addEventListener("pointerdown", press);

    button.addEventListener("pointerup", release);

    button.addEventListener("pointercancel", release);

    button.addEventListener("lostpointercapture", release);

    button.addEventListener("contextmenu", e => {
      e.preventDefault();
    });

  });

  // 页面失去焦点时释放所有按键

  window.addEventListener("blur", () => {

    document.querySelectorAll(".pressed").forEach(button => {
      sendKey(button.dataset.key, false);
      button.classList.remove("pressed");
    });

  });

})();
</script>

</body>
</html>
