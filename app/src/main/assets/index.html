<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>铠甲勇士激斗传</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#000}
#game{width:100%;height:100%;display:flex;justify-content:center;align-items:center}
ruffle-player{width:100%!important;height:100%!important}
#controls{position:fixed;inset:0;z-index:9999;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(2vw,10px) max(2vh,10px);pointer-events:none}

/* 风鹰侠图片式四方向键盘 */
#direction-pad{
  position:relative;z-index:10;
  width:clamp(190px,29vw,300px);height:clamp(190px,29vw,300px);
  flex-shrink:0;margin-bottom:2vh;
  background:url("wind-eagle-controller.png") center/contain no-repeat;
  pointer-events:auto;touch-action:none;
}
.dir-hit{
  position:absolute;z-index:2;
  background:transparent;border:0;outline:none;
  pointer-events:auto;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
.dir-hit.pressed{background:rgba(65,175,255,.22);filter:drop-shadow(0 0 8px #58baff)}
.dir-up{left:35%;top:3%;width:30%;height:31%;border-radius:45% 45% 20% 20%}
.dir-down{left:35%;bottom:3%;width:30%;height:31%;border-radius:20% 20% 45% 45%}
.dir-left{left:3%;top:35%;width:31%;height:30%;border-radius:45% 20% 20% 45%}
.dir-right{right:3%;top:35%;width:31%;height:30%;border-radius:20% 45% 45% 20%}

/* 中央徽章区域：不响应方向触控 */
#pad-center{position:absolute;z-index:3;left:35%;top:35%;width:30%;height:30%;border-radius:50%;pointer-events:none}

.skills{position:relative;z-index:10;pointer-events:auto;display:grid;
  grid-template-columns:repeat(3,clamp(54px,9vw,82px));
  grid-template-rows:repeat(2,clamp(54px,9vw,82px));
  gap:clamp(8px,2vw,18px);margin-bottom:5vh}
.skill{display:flex;justify-content:center;align-items:center;border-radius:50%;
  border:3px solid #ffffff88;color:white;font-size:clamp(25px,5vw,40px);
  font-weight:900;background:linear-gradient(145deg,#173c70cc,#061329ee);
  box-shadow:0 2px 10px #0008,inset 0 0 10px #4a8bce55;
  user-select:none;-webkit-user-select:none;pointer-events:auto;touch-action:none}
.skill.pressed{background:#187edb;box-shadow:0 0 16px #168cff,inset 0 0 10px #a9e5ff}
@media(orientation:portrait){
  #controls{padding:0 8px 18px}
  #direction-pad{width:155px;height:155px;margin-bottom:1vh}
  .skills{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px);gap:5px;margin-bottom:2vh}
  .skill{font-size:23px;border-width:2px}
}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.8.0/ruffle.js"></script>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="controls">
  <div id="direction-pad" aria-label="风鹰侠四方向键盘">
    <div class="dir-hit dir-up" data-key="KeyW" aria-label="上"></div>
    <div class="dir-hit dir-down" data-key="KeyS" aria-label="下"></div>
    <div class="dir-hit dir-left" data-key="KeyA" aria-label="左"></div>
    <div class="dir-hit dir-right" data-key="KeyD" aria-label="右"></div>
    <div id="pad-center"></div>
  </div>
  <div class="skills">
    <div class="skill" data-key="KeyJ">J</div>
    <div class="skill" data-key="KeyK">K</div>
    <div class="skill" data-key="KeyL">L</div>
    <div class="skill" data-key="KeyU">U</div>
    <div class="skill" data-key="KeyI">I</div>
    <div class="skill" data-key="KeyO">O</div>
  </div>
</div>
<script>
(function(){
  const container=document.getElementById("game");
  window.RufflePlayer=window.RufflePlayer||{};
  window.RufflePlayer.config={
    autoplay:"on",unmuteOverlay:"hidden",letterbox:"on",
    backgroundColor:"#000000",scale:"showAll",forceScale:true,
    allowScriptAccess:false,logLevel:"error",wmode:"direct",quality:"high"
  };
  function startGame(){
    if(!window.RufflePlayer||!window.RufflePlayer.newest){console.error("Ruffle加载失败");return;}
    const player=window.RufflePlayer.newest().createPlayer();
    player.id="ruffle-player";player.style.width="100%";player.style.height="100%";player.tabIndex=0;
    container.appendChild(player);window.flashPlayer=player;
    player.load({url:"game.swf",autoplay:"on"});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",startGame);else startGame();

  const keyInfo={
    KeyW:{key:"w",code:"KeyW",num:87},KeyS:{key:"s",code:"KeyS",num:83},
    KeyA:{key:"a",code:"KeyA",num:65},KeyD:{key:"d",code:"KeyD",num:68},
    KeyJ:{key:"j",code:"KeyJ",num:74},KeyK:{key:"k",code:"KeyK",num:75},
    KeyL:{key:"l",code:"KeyL",num:76},KeyU:{key:"u",code:"KeyU",num:85},
    KeyI:{key:"i",code:"KeyI",num:73},KeyO:{key:"o",code:"KeyO",num:79}
  };
  const held=new Map(),pointers=new Map();

  function sendKey(code,down){
    const player=window.flashPlayer||document.getElementById("ruffle-player"),info=keyInfo[code];
    if(!player||!info)return;
    player.focus();
    player.dispatchEvent(new KeyboardEvent(down?"keydown":"keyup",{
      key:info.key,code:info.code,keyCode:info.num,which:info.num,
      bubbles:true,cancelable:true,composed:true
    }));
  }
  function press(btn,id){
    const code=btn.dataset.key;if(pointers.has(id))return;
    pointers.set(id,code);
    const count=held.get(code)||0;held.set(code,count+1);
    btn.classList.add("pressed");
    if(count===0)sendKey(code,true);
  }
  function release(id){
    if(!pointers.has(id))return;
    const code=pointers.get(id);pointers.delete(id);
    const count=(held.get(code)||1)-1;
    if(count<=0){
      held.delete(code);
      document.querySelectorAll('[data-key="'+code+'"]').forEach(el=>el.classList.remove("pressed"));
      sendKey(code,false);
    }else held.set(code,count);
  }
  document.querySelectorAll("[data-key]").forEach(btn=>{
    btn.addEventListener("pointerdown",e=>{
      e.preventDefault();e.stopPropagation();
      try{btn.setPointerCapture(e.pointerId)}catch(err){}
      press(btn,e.pointerId);
    });
    btn.addEventListener("pointerup",e=>{e.preventDefault();release(e.pointerId)});
    btn.addEventListener("pointercancel",e=>release(e.pointerId));
    btn.addEventListener("lostpointercapture",e=>release(e.pointerId));
    btn.addEventListener("contextmenu",e=>e.preventDefault());
  });
  function releaseAll(){
    Array.from(pointers.keys()).forEach(release);
    held.clear();pointers.clear();
    document.querySelectorAll(".pressed").forEach(el=>el.classList.remove("pressed"));
  }
  window.addEventListener("blur",releaseAll);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)releaseAll()});
  document.addEventListener("contextmenu",e=>e.preventDefault());
})();
</script>
</body>
</html>
